
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone | Enter the Arena</title>
  <style>
    
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 20% 20%, #4c1d95 0%, transparent 45%),
    radial-gradient(ellipse at 80% 80%, #075985 0%, transparent 45%),
    #070914;
  color: #f8fafc;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}

.card {
  background: rgba(15, 18, 40, 0.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(139, 92, 246, 0.55);
  box-shadow:
    0 0 25px rgba(124, 58, 237, 0.25),
    0 0 70px rgba(37, 99, 235, 0.12);
  padding: 30px;
  border-radius: 20px;
  width: min(380px, 100%);
}

h2 {
  text-align: center;
  color: #c4b5fd;
  text-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
}

input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 15px;
}

input {
  background: #0b1020;
  color: white;
  border: 1px solid #394264;
  outline: none;
}

input:focus {
  border-color: #a78bfa;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.35);
}

input::placeholder {
  color: #9ca3af;
}

button {
  border: 0;
  background: linear-gradient(100deg, #7c3aed, #2563eb);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.55);
}

p {
  color: #cbd5e1;
  line-height: 1.5;
}

#message {
  overflow-wrap: anywhere;
}
  </style>
</head>
<body>
  <main class="card">
   <h2>🎮 GAMEZONE</h2>
<p>Enter the arena. Let the games begin.</p>
    <form id="signup-form">
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
      <button type="submit">Sign up</button>
    </form>

    <h2>Log in</h2>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email address" required>
      <input id="login-password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <button id="verify-button" hidden>Send verification email</button>
    <button id="logout-button" hidden>Log out</button>
    <p id="message" role="status">Create an account to get started.</p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendEmailVerification, signOut, onAuthStateChanged, reload
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_6VFXWGY1RM_svyiOd9yEW2t5WKSfIQQ",
      authDomain: "my-login-system-f61aa.firebaseapp.com",
      projectId: "my-login-system-f61aa",
      appId: "1:690463115845:web:a5fc8bc445f6202078712c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const message = document.getElementById("message");
    const signupForm = document.getElementById("signup-form");
    const loginForm = document.getElementById("login-form");
    const verifyButton = document.getElementById("verify-button");
    const logoutButton = document.getElementById("logout-button");

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(result.user);
        message.textContent = "Account created! Check your inbox for a verification link.";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        const result = await signInWithEmailAndPassword(auth, email, password);
        await reload(result.user);
        message.textContent = result.user.emailVerified
          ? "Login successful! Your email is verified."
          : "Your email is not verified yet. Send a verification email and check your inbox.";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    verifyButton.addEventListener("click", async () => {
      try {
        await reload(auth.currentUser);
        if (auth.currentUser.emailVerified) {
          message.textContent = "Your email is verified!";
        } else {
          await sendEmailVerification(auth.currentUser);
          message.textContent = "Verification email sent. Check your inbox.";
        }
      } catch (error) {
        message.textContent = error.message;
      }
    });

    logoutButton.addEventListener("click", async () => {
      await signOut(auth);
      message.textContent = "You have logged out.";
    });

    onAuthStateChanged(auth, (user) => {
      verifyButton.hidden = !user || user.emailVerified;
      logoutButton.hidden = !user;
    });
  </script>
</body>
</html>
