
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Login System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: min(320px, 80%);
      box-shadow: 0 8px 30px #0001;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>Create an account</h2>
    <p>Register to get started.</p>

    <form>
      <input type="email" placeholder="Email address" required>
      <input type="password" placeholder="Password" required minlength="6">
      <button type="submit">Sign up</button>
    </form>

    <p id="message">Your login system is coming soon!</p>
  </main>
</body>
</html>
